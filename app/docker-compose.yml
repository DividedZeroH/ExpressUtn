services:
  db:
    image: postgres:alpine
    env_file:
      - .env.db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 2s
      retries: 5
    volumes:
      - postgres-db:/var/lib/postgresql
    networks:
      - net

  # Base NoSQL. Solo se usa cuando DB_DRIVER=mongoose. Levantarla con:
  #   docker compose up -d --wait mongo
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-db:/data/db
    networks:
      - net

  backend:
    build: .
    command: node src/app.js
    env_file:
      - .env.db
    ports:
      - "3000:3000"
    volumes:
      - ./src:/code/src
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - net

  generate:
    build: .
    user: root
    command: >
      /bin/sh -c '
        mkdir -p src/config src/models src/migrations src/seeders src/routes src/admin &&
        echo "Estructura del proyecto generada exitosamente en ./src/"
      '
    env_file:
      - .env.db
    volumes:
      - .:/code
    networks:
      - net

  manage:
    build: .
    entrypoint: npx sequelize-cli
    env_file:
      - .env.db
    volumes:
      - ./src:/code/src
      - ./.sequelizerc:/code/.sequelizerc
    depends_on:
      db:
        condition: service_healthy
    networks:
      - net

networks:
  net:

volumes:
  postgres-db:
  mongo-db:
